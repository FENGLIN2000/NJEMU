name: PS2 CPS1 STEP 4 - spin-wait (no GS sleep)

# STEP 4 - SINGLE-VARIABLE TEST. Run only after STEP 1 boots cleanly.
# Official v3.1.0 is the only known safe boot baseline. This build is
# byte-identical to it except src/ps2/ps2_video.c: the two per-submission
# completion waits (GS FINISH and GIF DMA) spin on their hardware bits
# instead of sleeping on interrupt semaphores. That removes >= 4 scheduler
# wake-ups per frame, which can push the flip past the current VBlank.
# The low-latency cps1.77 ELF had zero jal calls in its queue executor.
# NOT touched: queue submitter, both DMA submissions, FRAME/SCISSOR batching,
# DISPFB2 phase, VBlank wait (still INTC_VBLANK_S), flip order, pacing, input,
# main loop, ini defaults. VideoSync=yes / 60FPSLimit=yes stay unchanged.
# Upload as a NEW workflow file - nothing needs to be deleted or overwritten.
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'canonical = official BOOT.ELF layout; single-elf = one directly launchable CPS1.ELF'
        required: true
        default: 'canonical'
        type: choice
        options:
          - canonical
          - single-elf

permissions:
  contents: read

jobs:
  build:
    name: PS2 / CPS1 (official GS chain + spin waits)
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    timeout-minutes: 90

    steps:
      # git must exist BEFORE checkout so actions/checkout uses a real clone.
      - name: Install build tools
        run: apk add --no-cache build-base git bash cmake coreutils tar gzip

      - name: Checkout NJEMU
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install official sources + STEP 4 spin waits
