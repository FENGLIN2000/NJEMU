name: PS2 CPS1 low-latency build

# Self-contained build. The four patched sources are embedded (compressed)
# and installed unconditionally, so this workflow needs no .git directory,
# no git history and no network access to fetch sources.
# Acceptable filenames: ps2-cps1-latency-fix.yml or ps2.yml (replacing upstream).
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'canonical = official BOOT.ELF layout; single-elf = one directly launchable CPS1.ELF'
        required: true
        default: 'canonical'
        type: choice
        options:
          - canonical
          - single-elf
  push:
    paths:
      - '.github/workflows/ps2.yml'
      - '.github/workflows/ps2-cps1-latency-fix.yml'
      - 'src/ps2/ps2_video.c'
      - 'src/emumain.c'
      - 'src/common/game_pacing_defaults.h'
      - 'tests/game_pacing_defaults_tests.c'

permissions:
  contents: read

jobs:
  build:
    name: PS2 / CPS1 (latency fix)
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    timeout-minutes: 90

    steps:
      # git must exist BEFORE checkout so actions/checkout uses a real clone.
      - name: Install build tools
        run: apk add --no-cache build-base git bash cmake coreutils tar gzip

      - name: Checkout NJEMU
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install patched sources
        shell: bash
        run: |
          set -euo pipefail
