name: PS2 CPS1 low-latency build

# Self-contained build. This file may be named ps2.yml (replacing the
# upstream matrix workflow) or ps2-cps1-latency-fix.yml. The embedded
# patch restores pristine v3.1.0 sources and applies the DISPFB2/VBlank
# latency fix before compiling, so no other uploaded file is required.
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'canonical = official BOOT.ELF layout; single-elf = one directly launchable CPS1.ELF'
        required: true
        default: 'canonical'
        type: choice
        options:
          - canonical
          - single-elf
  push:
    paths:
      - '.github/workflows/ps2.yml'
      - '.github/workflows/ps2-cps1-latency-fix.yml'
      - 'src/ps2/ps2_video.c'
      - 'src/emumain.c'
      - 'src/common/game_pacing_defaults.h'
      - 'tests/game_pacing_defaults_tests.c'

permissions:
  contents: read

jobs:
  build:
    name: PS2 / CPS1 (latency fix)
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    timeout-minutes: 90

    steps:
      - name: Checkout NJEMU
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install build tools
        run: apk add --no-cache build-base git bash cmake coreutils

      - name: Apply the embedded latency fix
