          B64_EOF
          base64 -d /tmp/src.b64 > /tmp/src.tar.gz
          mkdir -p src/ps2 src/common tests
          # gzip + tar are installed in the first step; no .git, no history, no network needed.
          gzip -dc /tmp/src.tar.gz | tar -xf - -C .
          echo 'Installed patched sources:'
          wc -c src/ps2/ps2_video.c src/emumain.c src/common/game_pacing_defaults.h tests/game_pacing_defaults_tests.c

      - name: Verify the fix is present
        shell: bash
        run: |
          set -euo pipefail
          flip_start=$(grep -n '^static void ps2_flipScreen' src/ps2/ps2_video.c | tail -1 | cut -d: -f1)
          test -n "$flip_start"
          sed -n "${flip_start},/^}/p" src/ps2/ps2_video.c > /tmp/flip.c
          ! grep -q 'ps2_wait_for_vblank();' /tmp/flip.c
          test "$(grep -c 'PollSema(vsync_sema_id)' /tmp/flip.c)" -eq 1
          test "$(grep -c 'WaitSema(vsync_sema_id)' /tmp/flip.c)" -eq 1
          p=$(grep -n 'PollSema(vsync_sema_id)' /tmp/flip.c | head -1 | cut -d: -f1)
          g=$(grep -n 'gsKit_flip(ps2->gsGlobal)' /tmp/flip.c | head -1 | cut -d: -f1)
          w=$(grep -n 'WaitSema(vsync_sema_id)' /tmp/flip.c | head -1 | cut -d: -f1)
          test "$p" -lt "$g"
          test "$g" -lt "$w"
          grep -q 'const bool pace_before_flip = false;' src/emumain.c
          awk '/#if defined\(PS2\)/,/#elif defined\(PSP\)/' \
            src/common/game_pacing_defaults.h | grep -q 'define NJEMU_DEFAULT_FRAME_LIMIT 1'
          echo "OK: DISPFB2 leads VBlank (PollSema=$p < flip=$g < WaitSema=$w); PS2 limiter on."

      - name: Checkout ps2_drivers (required by every PS2 build)
        uses: actions/checkout@v7
        with:
          repository: fjtrujy/ps2_drivers
          ref: njemu
          path: .ci-deps/ps2_drivers
          persist-credentials: false

      - name: Build, validate and install ps2_drivers
        run: |
          (git -C .ci-deps/ps2_drivers rev-parse HEAD || echo 'ps2_drivers: no git metadata (tarball checkout)')
          cmake -S .ci-deps/ps2_drivers -B .ci-deps/ps2_drivers/build \
            -DCMAKE_TOOLCHAIN_FILE="$PS2DEV/share/ps2dev.cmake" \
            -DBUILD_SAMPLES=OFF
          cmake --build .ci-deps/ps2_drivers/build \
            --parallel "$(getconf _NPROCESSORS_ONLN)"
          cmake --build .ci-deps/ps2_drivers/build --target \
            ps2_drivers_irximg_check ps2_drivers_irximg_stage_check \
            ps2_drivers_img_payload_check ps2_drivers_hdd_launch_check \
            ps2_drivers_bootstrap_args_check
          cmake --install .ci-deps/ps2_drivers/build
          test -s "$PS2SDK/ports/lib/libps2_drivers_img.a"
          test -s "$PS2SDK/ports/include/cacheio.h"
          test -s "$PS2SDK/ports/share/ps2_drivers/ps2_drivers.irximg"
          test -s "$PS2SDK/ports/share/ps2_drivers/ps2_drivers_irximg_bootstrap.elf"

      - name: Compile PS2 / CPS1
        shell: bash
        run: |
          set -euo pipefail
          pkg="${{ inputs.package || 'canonical' }}"
          if [ "$pkg" = "canonical" ]; then
            extra=(-DNJEMU_CANONICAL_RELEASE=ON -DPS2_EXTERNAL_IRX_IMAGE=ON)
          else
            extra=(-DPS2_EXTERNAL_IRX_IMAGE=OFF)
          fi
          mkdir -p build
          cd build
          cmake -DPLATFORM=PS2 \
            -DCMAKE_TOOLCHAIN_FILE="$PS2DEV/share/ps2dev.cmake" \
            -DTARGET=CPS1 \
            -DCOMMAND_LIST=ON \
            -DADHOC=OFF \
            -DSAVE_STATE=ON \
            -DGUI=ON \
            -DPS2_FAST_CACHE=OFF \
            "${extra[@]}" \
            ..
          cmake --build . --parallel "$(getconf _NPROCESSORS_ONLN)"
          cmake --install .
          if [ "$pkg" = "canonical" ]; then
            test -s install/BOOT.ELF
            test -s install/CPS1
            test -s install/ps2_drivers.irximg
            ls -lh install/BOOT.ELF install/CPS1
          else
            test -s install/CPS1.ELF
            ls -lh install/CPS1.ELF
          fi

      - name: Bundle low-latency configuration
        run: |
          mkdir -p build/install
          cat > build/install/njemu.ini <<'EOF'
          [System Settings]
          INIFileVersion=23

          [Video Settings]
          VideoSync=yes
          AutoFrameSkip=no
          FrameSkipLevel=0
          ShowFPS=no
          60FPSLimit=yes
          EOF
          echo 'Bundled njemu.ini:'
          cat build/install/njemu.ini

      - name: Upload PS2 CPS1 package
        uses: actions/upload-artifact@v7
        with:
          name: NJEMU-PS2-CPS1-${{ inputs.package || 'canonical' }}-latency-fix
          path: build/install/
          if-no-files-found: error
          retention-days: 30
