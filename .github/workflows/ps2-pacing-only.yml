name: PS2 CPS1 frame-pacing-only (no GS changes)

# STEP 2 - SINGLE-VARIABLE TEST. Only after step 1 boots cleanly.
# Identical to the official v3.1.0 build except src/common/frame_pacing.h:
# VSync ON waits for VBlank on EVERY frame, even with 60FPSLimit=yes.
# The whole GS presentation chain is byte-identical to official v3.1.0, so this
# cannot produce the garbling/hard-lock caused by the retired queue rollback.
# Upload as .github/workflows/ps2-pacing-only.yml and start it manually.
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'canonical = official BOOT.ELF layout; single-elf = one directly launchable CPS1.ELF'
        required: true
        default: 'canonical'
        type: choice
        options:
          - canonical
          - single-elf

permissions:
  contents: read

jobs:
  build:
    name: PS2 / CPS1 (stock GS chain + pacing header only)
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    timeout-minutes: 90

    steps:
      # git must exist BEFORE checkout so actions/checkout uses a real clone.
      - name: Install build tools
        run: apk add --no-cache build-base git bash cmake coreutils tar gzip

      - name: Checkout NJEMU
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install stock v3.1.0 sources
