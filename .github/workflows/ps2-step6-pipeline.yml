name: PS2 CPS1 STEP 6 - pipelined second DMA

# STEP 6 (candidate A) - SINGLE-VARIABLE TEST. Run only after STEP 1 boots.
# Official v3.1.0 is the only known safe boot baseline. This build is
# byte-identical to it except src/ps2/ps2_video.c: for the END-OF-FRAME
# submission only, the second GIF DMA chain no longer waits for the GS to
# finish drawing the first batch. The GIF DMA channel wait is still kept,
# and ps2_flipScreen() still waits on the final FINISH before DISPFB2.
# All other submit paths (partial flush, screenshot, output mode change,
# flushAndWait) keep the official serialized behavior.
# NOT touched: queue state machine, DMA tags/dbuf, persistent restore,
# FRAME/SCISSOR batching, DISPFB2 phase, VBlank wait, flip order, pacing,
# input, main loop, ini defaults. VideoSync=yes / 60FPSLimit=yes unchanged.
# Based on official stock, NOT on STEP 4/5. New file: nothing to delete.
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'canonical = official BOOT.ELF layout; single-elf = one directly launchable CPS1.ELF'
        required: true
        default: 'canonical'
        type: choice
        options:
          - canonical
          - single-elf

permissions:
  contents: read

jobs:
  build:
    name: PS2 / CPS1 (official GS chain + pipelined 2nd submit)
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    timeout-minutes: 90

    steps:
      # git must exist BEFORE checkout so actions/checkout uses a real clone.
      - name: Install build tools
        run: apk add --no-cache build-base git bash cmake coreutils tar gzip

      - name: Checkout NJEMU
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install official sources + STEP 6 pipelined submit
