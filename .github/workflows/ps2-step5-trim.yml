name: PS2 CPS1 STEP 5 - trim redundant FINISH waits

# STEP 5 - SINGLE-VARIABLE TEST. Run only after STEP 4 boots cleanly.
# STEP 4 (spin on GS FINISH / GIF DMA) removed the jitter but the fixed 1-2
# frame latency remained. Upstream ps2dev/gsKit gsCore.c proves v3.1.0 added
# TWO extra "wait until the GS finished drawing" points that the old
# low-latency ELF never had:
#   (a) GS_PERSISTENT branch of ps2_submit_gs_queue(): official code only
#       waits for the DMA channel (dmaKit_wait_fast); v3.1.0 waits for FINISH.
#   (b) ps2_flipScreen() right after ps2_execute_gs_queue(): official
#       gsKit_sync_flip() has NO finish wait after gsKit_queue_exec().
# This build restores the official wait COUNT while keeping STEP 4's spin
# waits. Queue state machine, both DMAs, FRAME/SCISSOR batching, DISPFB2
# phase and VBlank-first order are unchanged. VideoSync=yes / 60FPSLimit=yes.
# Upload as a NEW workflow file - nothing needs to be deleted or overwritten.
# RISK: a very heavy frame may display a partially drawn buffer. Keep the
# STEP 4 ELF so you can roll back immediately if you see garbage/tearing.
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'canonical = official BOOT.ELF layout; single-elf = one directly launchable CPS1.ELF'
        required: true
        default: 'canonical'
        type: choice
        options:
          - canonical
          - single-elf

permissions:
  contents: read

jobs:
  build:
    name: PS2 / CPS1 (STEP 4 spin + official FINISH wait count)
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    timeout-minutes: 90

    steps:
      # git must exist BEFORE checkout so actions/checkout uses a real clone.
      - name: Install build tools
        run: apk add --no-cache build-base git bash cmake coreutils tar gzip

      - name: Checkout NJEMU
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install official sources + STEP 5 trimmed waits
