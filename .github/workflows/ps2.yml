name: PS2 CPS1 OFFICIAL v3.1.0 (STOCK - run this first)

# STEP 1 - RECOVERY BUILD. Use this after the garbled-screen / hard-lock.
# All six files touched by earlier latency patches are force-restored to the
# official v3.1.0 content. Zero GS queue, DMA, FRAME/SCISSOR or DISPFB2 changes.
# No .git history, no source download.
# Named ps2.yml on purpose: uploading it REPLACES the retired patched
# ps2.yml in place. No deletion needed. Start it manually.
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'canonical = official BOOT.ELF layout; single-elf = one directly launchable CPS1.ELF'
        required: true
        default: 'canonical'
        type: choice
        options:
          - canonical
          - single-elf

permissions:
  contents: read

jobs:
  build:
    name: PS2 / CPS1 (official v3.1.0, zero patches)
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    timeout-minutes: 90

    steps:
      # git must exist BEFORE checkout so actions/checkout uses a real clone.
      - name: Install build tools
        run: apk add --no-cache build-base git bash cmake coreutils tar gzip

      - name: Checkout NJEMU
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install stock v3.1.0 sources
