name: PS2 CPS1 sync-presentation build

# Self-contained build. Six sources are embedded (compressed base64): three
# changed (synchronous presentation) plus three restored stock v3.1.0 files.
# No .git history, no patch, no network access to fetch sources.
# Upload as .github/workflows/ps2.yml, replacing the previous build.
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'canonical = official BOOT.ELF layout; single-elf = one directly launchable CPS1.ELF'
        required: true
        default: 'canonical'
        type: choice
        options:
          - canonical
          - single-elf
  push:
    paths:
      - '.github/workflows/ps2.yml'
      - '.github/workflows/ps2-cps1-latency-fix.yml'
      - 'src/ps2/ps2_video.c'
      - 'src/emumain.c'
      - 'src/common/game_pacing_defaults.h'
      - 'tests/game_pacing_defaults_tests.c'
      - 'src/common/frame_pacing.h'
      - 'tests/frame_pacing_tests.c'

permissions:
  contents: read

jobs:
  build:
    name: PS2 / CPS1 (sync presentation)
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    timeout-minutes: 90

    steps:
      # git must exist BEFORE checkout so actions/checkout uses a real clone.
      - name: Install build tools
        run: apk add --no-cache build-base git bash cmake coreutils tar gzip

      - name: Checkout NJEMU
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install restored presentation sources
        shell: bash
        run: |
