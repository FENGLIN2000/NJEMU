          PAYLOAD
          test "$(sha256sum njemu/src/ps2/ps2_video.c | cut -d' ' -f1)" = "65bb35259443ec6276187ce04b98611225137a1e2f6cf38d8b3e77bbaf8e8bd5"
          grep -q 'gsGlobal->Width = 704;' njemu/src/ps2/ps2_video.c
          grep -q 'gsGlobal->Height = 480;' njemu/src/ps2/ps2_video.c
          grep -q 'gsGlobal->Interlace = GS_INTERLACED;' njemu/src/ps2/ps2_video.c
          grep -q 'gsGlobal->Field = GS_FIELD;' njemu/src/ps2/ps2_video.c
          grep -q 'gsKit_queue_exec(ps2->gsGlobal);' njemu/src/ps2/ps2_video.c
          grep -q 'gsKit_sync_flip(ps2->gsGlobal);' njemu/src/ps2/ps2_video.c
          echo "PATCH OK: explicit NTSC 480i geometry, legacy chain preserved"

      - name: Install build dependencies
        run: apk add --no-cache build-base git bash cmake

      - name: Configure and build CPS1 (GUI=${{ matrix.gui }})
        run: |
          set -eu
          cd njemu
          mkdir -p build
          cd build
          cmake -DPLATFORM="PS2" \
            -DCMAKE_TOOLCHAIN_FILE=$PS2DEV/share/ps2dev.cmake \
            -DTARGET="CPS1" \
            -DGUI=${{ matrix.gui }} \
            -DLARGE_MEMORY=OFF \
            -DCOMMAND_LIST=OFF \
            -DADHOC=OFF \
            -DSAVE_STATE=OFF \
            ..
          make -j"$(getconf _NPROCESSORS_ONLN)"
          cmake --install .
          echo "=== build/install tree ==="
          find install -maxdepth 2 -type f | sort

      - name: Verify ELF and GUI flag
        run: |
          set -eu
          test -s njemu/build/install/CPS1.elf
          ls -lh njemu/build/install/CPS1.elf
          grep -q "GUI:BOOL=${{ matrix.gui }}" njemu/build/CMakeCache.txt
          echo "ELF OK, GUI=${{ matrix.gui }}"

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NJEMU-PS2-CPS1-legacy510-480ifix-gui-${{ matrix.gui }}
          path: njemu/build/install/
          if-no-files-found: error
